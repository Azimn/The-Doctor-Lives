name: Article 08 Household Practice Tests
on:
  push:
    branches:
      - experiment/article08-native-selected-practice-20261018
  pull_request:
    paths:
      - doctor_lives/home_native_practice.py
      - tests/test_home_native_practice.py
      - tools/run_home_native_practice.py
      - .github/workflows/article08-native-practice.yml
  workflow_dispatch:
jobs:
  practice-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Azimn/Pretorius-Laboratory
          ref: 6e49795752835d64fa6fd63d16359669a1ca2ba7
          path: pinned-laboratory
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e .
      - name: Validate household practice
        env:
          PYTHONPATH: pinned-laboratory
        run: python -m unittest discover -s tests -p test_home_native_practice.py -v
      - name: Execute three-seed comparison
        env:
          PYTHONPATH: pinned-laboratory
        run: python -m tools.run_home_native_practice --output results/native_practice.json
      - name: Archive experiment output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: article08-household-practice
          path: results/native_practice.json
          if-no-files-found: warn
