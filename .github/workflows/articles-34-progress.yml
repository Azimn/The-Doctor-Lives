name: Articles of Artificiality progress tracker
on:
  push:
    paths:
      - research/articles_34_progress.json
      - research/articles_34_environment_plan.json
      - docs/experiments/PRETORIUS_LAB_FIRST_34_ARTICLE_ROADMAP.md
      - tools/render_articles_progress.py
      - tests/test_articles_progress_tracker.py
      - docs/experiments/ARTICLES_34_PROGRESS.md
      - .github/workflows/articles-34-progress.yml
  pull_request:
    paths:
      - research/articles_34_progress.json
      - research/articles_34_environment_plan.json
      - docs/experiments/PRETORIUS_LAB_FIRST_34_ARTICLE_ROADMAP.md
      - tools/render_articles_progress.py
      - tests/test_articles_progress_tracker.py
      - docs/experiments/ARTICLES_34_PROGRESS.md
      - .github/workflows/articles-34-progress.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-progress:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify tracker and generation invariants
        run: python -m unittest discover -s tests -p test_articles_progress_tracker.py -v
      - name: Enforce reproducible dashboard
        run: python tools/render_articles_progress.py --check
