name: Candidate B - gated 20 minute and four hour original Laboratory trial

# Pushes to this workflow do NOT start four hours. Only an explicit
# owner-approved launch marker on this isolated branch can activate it.
on:
  push:
    branches:
      - integration/candidate-b-complete-lab-20261031
    paths:
      - qa/candidate-b/LAUNCH-FOUR-HOUR.txt

permissions:
  contents: read

jobs:
  verified-unread-17:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Preserve literal reviewed bytes
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: Azimn/Pretorius-Laboratory
          ref: 6e49795752835d64fa6fd63d16359669a1ca2ba7
          path: donor-laboratory
      - uses: actions/checkout@v4
        with:
          repository: Azimn/Sensus-Communis-Artificialis
          ref: 802e459ee68950414347d5fa324484c034f57b81
          path: donor-sensus
      - uses: actions/checkout@v4
        with:
          repository: Azimn/Sensus-Communis-Artificialis
          ref: 904bf11861700739ccc03d4b0d4340ff3422a7d3
          path: donor-affectus
      - uses: actions/checkout@v4
        with:
          repository: Azimn/synthetic-ipseity
          ref: e2d1dc3978c952e59d270a29e84704c8a1fe264a
          path: donor-ipseity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned source dependencies for actual 17-volume builder
        run: |
          python -m pip install ./donor-ipseity ./donor-laboratory .
      - name: Build verified full texts and pristine untouched 17-book world
        env:
          PYTHONPATH: ${{ github.workspace }}/donor-laboratory:${{ github.workspace }}/donor-sensus
        run: |
          python tools/verify_17_full_text_lab.py --lab-source donor-laboratory --affectus-source donor-affectus --output-dir "${{ runner.temp }}/seventeen"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "seventeen"
          report = json.loads((p / "acceptance.json").read_text())
          assert report["pristine_book_count"] == 17
          assert report["physical_shelves_verified"] == 17
          assert report["pristine_prior_world_moves"] == 0
          assert report["distinct_lived_read_memories"] == 17
          from doctor_lives.preview_17_books import verify_unread_seventeen
          check = verify_unread_seventeen(p / "unread-17-full-text-lab.sqlite3")
          assert check["books_installed"] == 17 and check["prior_reads"] == 0
          print("PRISTINE_17_LIBRARY=" + json.dumps(check, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-pristine-seventeen-source-evidence
          path: |
            ${{ runner.temp }}/seventeen/unread-17-full-text-lab.sqlite3
            ${{ runner.temp }}/seventeen/acceptance.json
            ${{ runner.temp }}/seventeen/catalog.json
          retention-days: 30
          if-no-files-found: error

  platform-bundle-install:
    needs: verified-unread-17
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - name: Preserve reviewed donor bytes including Windows LF
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: Azimn/Pretorius-Laboratory
          ref: 6e49795752835d64fa6fd63d16359669a1ca2ba7
          path: donor-laboratory
      - uses: actions/checkout@v4
        with:
          repository: Azimn/Sensus-Communis-Artificialis
          ref: 802e459ee68950414347d5fa324484c034f57b81
          path: donor-sensus
      - uses: actions/checkout@v4
        with:
          repository: Azimn/Sensus-Communis-Artificialis
          ref: 904bf11861700739ccc03d4b0d4340ff3422a7d3
          path: donor-affectus
      - uses: actions/checkout@v4
        with:
          repository: Azimn/synthetic-ipseity
          ref: e2d1dc3978c952e59d270a29e84704c8a1fe264a
          path: donor-ipseity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-pristine-seventeen-source-evidence
          path: ${{ runner.temp }}/seventeen
      - name: Assemble sealed platform wheelhouse
        shell: bash
        run: |
          python -m pip wheel --wheel-dir "$RUNNER_TEMP/wheelhouse"             "numpy==2.5.4" "scipy==1.18.1" . ./donor-laboratory ./donor-ipseity
          python tools/assemble_17_operator_bundle.py             --wheels "$RUNNER_TEMP/wheelhouse"             --source-report "$RUNNER_TEMP/seventeen/acceptance.json"             --sensus donor-sensus --affectus donor-affectus             --laboratory donor-laboratory --ipseity donor-ipseity             --output "$RUNNER_TEMP/pretorius-seventeen-${{ matrix.platform }}.zip"             --doctor-commit "${{ github.event.pull_request.head.sha || github.sha }}"             --platform "${{ matrix.platform }}"
      - name: Clean offline install with untouched 17-book world, installed wheels and donor checks
        shell: bash
        run: |
          python tools/check_17_operator_bundle.py             --archive "$RUNNER_TEMP/pretorius-seventeen-${{ matrix.platform }}.zip"             --expected-sha "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-17-book-operator-${{ matrix.platform }}
          path: ${{ runner.temp }}/pretorius-seventeen-${{ matrix.platform }}.zip
          retention-days: 30
          if-no-files-found: error

  independent-uncoached-r4:
    needs: platform-bundle-install
    runs-on: ubuntu-24.04
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: experimental-17-book-operator-linux
          path: ${{ runner.temp }}/operator-download
      - name: Install verified source-pinned world offline with zero goal inputs
        run: |
          python - <<'PY'
          import os, pathlib, zipfile
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          target = root / "operator-source"
          target.mkdir()
          with zipfile.ZipFile(root / "operator-download/pretorius-seventeen-linux.zip") as pack:
              assert all(not (x.startswith("/") or ".." in pathlib.Path(x).parts)
                         for x in pack.namelist())
              pack.extractall(target)
          PY
          python "${{ runner.temp }}/operator-source/install.py" --install-root "${{ runner.temp }}/r4-installed"
      - name: Independent three-distinct-activity R4 test, no task messages or scripted choices
        run: |
          python tools/run_uncoached_r4_trial.py \
            --install-root "${{ runner.temp }}/r4-installed" --seconds 1200 \
            --report "${{ runner.temp }}/independent-r4-report.json"
      - name: Source-pinned Conclave and Phantasmagorium ingress checks
        run: |
          python -m unittest discover -s tests -p test_conclave.py -v
          python -m unittest discover -s tests -p test_candidate_b_phantasmagorium.py -v
          python tools/ipseity_entrypoint_gate.py
      - name: Require full donor validation and three uncoached activity classes before four hours
        run: |
          test -f "qa/candidate-b/ORGANOID-DONOR-ACCEPTED.txt"
          python - <<'PY'
          from pathlib import Path
          import json,os
          report=json.loads((Path(os.environ["RUNNER_TEMP"])/"independent-r4-report.json").read_text())
          assert report["three_distinct_uncoached"] is True
          assert report["status"] == "PASS"
          print("Three-activity source gate PASS; allowed to begin four-hour witness")
          PY
      - name: Four REAL hours of public preview-resume, observed independently
        timeout-minutes: 270
        run: |
          python tools/candidate_b_four_hour_monitor.py \
            --install-root "${{ runner.temp }}/r4-installed" \
            --seconds 14400 --interval 30 \
            --report-dir "${{ runner.temp }}/candidate-b-four-hour"
      - name: Recheck source-authenticated Laboratory and BrainStore after four hours
        run: |
          python tools/audit_three_uncoached.py \
            --workspace "${{ runner.temp }}/r4-installed/workspace" \
            --report "${{ runner.temp }}/candidate-b-four-hour/independent-r4-final.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          base=Path(os.environ["RUNNER_TEMP"])/"candidate-b-four-hour"
          witness=json.loads((base/"four-hour-witness.json").read_text())
          audit=json.loads((base/"independent-r4-final.json").read_text())
          assert witness["pass"] is True
          assert audit["three_distinct_uncoached"] is True
          assert audit["status"] == "PASS"
          print("Four-hour candidate B witness and original source-ledger R4 both passed")
          PY
      - name: Preserve four-hour evidence and current persistent world on failure or success
        if: always()
        run: |
          python - <<'PY'
          import os, zipfile, pathlib
          base=pathlib.Path(os.environ["RUNNER_TEMP"])
          output=base/"candidate-b-four-hour"
          output.mkdir(exist_ok=True)
          workspace=base/"r4-installed/workspace"
          if workspace.is_dir():
              with zipfile.ZipFile(output/"world-and-mind.zip","w",zipfile.ZIP_DEFLATED) as pack:
                  for file in sorted(workspace.rglob("*")):
                      if file.is_file() and not file.is_symlink():
                          pack.write(file,arcname=file.relative_to(workspace))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-b-four-hour-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-b-four-hour/
          retention-days: 30
          if-no-files-found: warn
      - name: Retain exact-R4 failure evidence regardless of verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-uncoached-three-activities-r4
          path: ${{ runner.temp }}/independent-r4-report.json
          retention-days: 30
          if-no-files-found: warn
