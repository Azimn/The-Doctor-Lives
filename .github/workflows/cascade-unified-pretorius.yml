name: CASCADE unified Pretorius experiment
on:
  push:
    branches: [experiment/cascade-unified-pretorius-20261014]
  pull_request:
    paths:
      - doctor_lives/cascade_governance.py
      - doctor_lives/cascade_preview.py
      - doctor_lives/cascade_laboratory.py
      - tools/run_cascade_laboratory_pilot.py
      - tests/test_cascade_laboratory.py
      - doctor_lives/cascade_background.py
      - doctor_lives/cascade_articles.py
      - doctor_lives/data/articles_v3_contract.json
      - tests/test_cascade_preview.py
      - tests/test_cascade_background.py
      - tests/test_cascade_articles.py
      - tests/test_cascade_pilot.py
      - tools/run_cascade_articles_pilot.py
      - tools/run_cascade_cooldown_diagnostic.py
      - tests/test_cascade_cooldown_diagnostic.py
      - .github/workflows/cascade-unified-pretorius.yml
      - pyproject.toml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conformance:
    name: Real four-organ host and CASCADE contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Checkout frozen organ donors
        run: |
          git clone -q https://github.com/Azimn/synthetic-ipseity.git "$RUNNER_TEMP/ipseity"
          git -C "$RUNNER_TEMP/ipseity" checkout --detach a70a7e9fc61ddf1706d27bfa0b0edf3caf71b7fa
          test "$(git -C "$RUNNER_TEMP/ipseity" rev-parse HEAD)" = a70a7e9fc61ddf1706d27bfa0b0edf3caf71b7fa
          git clone -q https://github.com/Azimn/Sensus-Communis-Artificialis.git "$RUNNER_TEMP/Sensus"
          git -C "$RUNNER_TEMP/Sensus" checkout --detach 802e459ee68950414347d5fa324484c034f57b81
          test "$(git -C "$RUNNER_TEMP/Sensus" rev-parse HEAD)" = 802e459ee68950414347d5fa324484c034f57b81
      - name: Checkout frozen Laboratory world
        run: |
          git clone -q https://github.com/Azimn/Pretorius-Laboratory.git "$RUNNER_TEMP/Laboratory"
          git -C "$RUNNER_TEMP/Laboratory" checkout --detach 290ec97727c84728e61f69265949551e4ce911ec
          test "$(git -C "$RUNNER_TEMP/Laboratory" rev-parse HEAD)" = 290ec97727c84728e61f69265949551e4ce911ec
          python -m pip install -e "$RUNNER_TEMP/Laboratory"
      - name: Install canonical host and pinned optional governor
        run: |
          python -m pip install -e ".[self-reference-governor-preview]"
      - name: Run CASCADE contracts and ACTUAL Pretorius integration
        env:
          PYTHONPATH: ${{ runner.temp }}/Sensus:.
        run: |
          python -m unittest discover -s tests -p 'test_cascade*.py' -v
          python -m tools.run_cascade_articles_pilot --output results/cascade/CI_ARTICLES_V3_PILOT.json
          python -m tools.run_cascade_cooldown_diagnostic --output results/cascade/CI_COOLDOWN_DIAGNOSTIC.json
          python -m tools.run_cascade_laboratory_pilot --output results/cascade/CI_LABORATORY_ACTION_PILOT.json
      - name: Protect existing three-organ behavior
        env:
          PYTHONPATH: ${{ runner.temp }}/Sensus:.
        run: |
          python -m unittest discover -s tests -p test_three_organ_preview.py -v
          python -m unittest discover -s tests -p test_self_reference_governor_preview.py -v
      - name: Protect production first-person entrypoint
        run: python tools/ipseity_entrypoint_gate.py
      - name: Ensure no optional live hosts silently skipped
        env:
          PYTHONPATH: ${{ runner.temp }}/Sensus:.
        run: |
          python - <<'PY'
          import importlib
          from sensus_artificialis import Percept
          from synthetic_ipseity import DurableIpseityHost
          from doctor_lives.cascade_preview import CascadePretoriusPreview
          from pretorius_lab.embodied_access import EmbodiedAccess
          assert Percept and DurableIpseityHost and CascadePretoriusPreview and EmbodiedAccess
          print("Real optional donor imports and experiment host present")
          PY
      - name: Archive actual case-level engineering outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cascade-articles-v3-py${{ matrix.python-version }}
          path: |
            results/cascade/CI_ARTICLES_V3_PILOT.json
            results/cascade/CI_COOLDOWN_DIAGNOSTIC.json
            results/cascade/CI_LABORATORY_ACTION_PILOT.json
