name: causal-architecture-audit-v04

on:
  push:
    branches:
      - feature/pretorius-state-policy-v0.4
    paths-ignore:
      - "results/causal_architecture_audit_v04/**"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout historical v0.4 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clean-install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Run full regression suite
        run: python -m unittest discover -s tests -v

      - name: Run v0.4 causal comparison audit read-only
        run: |
          python tools/run_causal_architecture_audit_v04.py \
            --output results/causal_architecture_audit_v04/audit.json \
            --summary results/causal_architecture_audit_v04/summary.json

      - name: Show v0.4 causal summary
        run: cat results/causal_architecture_audit_v04/summary.json

      - name: Upload complete v0.4 causal traces
        uses: actions/upload-artifact@v4
        with:
          name: causal-architecture-audit-v04-${{ github.sha }}-${{ github.run_id }}
          path: results/causal_architecture_audit_v04/
          if-no-files-found: error
