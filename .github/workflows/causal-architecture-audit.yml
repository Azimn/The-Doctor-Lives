name: causal-architecture-audit

on:
  workflow_dispatch:
  push:
    branches:
      - feature/pretorius-causal-audit-v0.3
    paths-ignore:
      - "results/causal_architecture_audit/**"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout causal-audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clean-install v0.3 package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Run full regression suite
        run: python -m unittest discover -s tests -v

      - name: Run production causal architecture audit
        run: |
          python tools/run_causal_architecture_audit.py \
            --output results/causal_architecture_audit/audit.json \
            --summary results/causal_architecture_audit/summary.json

      - name: Show causal summary
        run: cat results/causal_architecture_audit/summary.json

      - name: Upload complete causal traces
        uses: actions/upload-artifact@v4
        with:
          name: causal-architecture-audit-${{ github.sha }}-${{ github.run_id }}
          path: results/causal_architecture_audit/
          if-no-files-found: error

      - name: Commit durable audit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/causal_architecture_audit/audit.json results/causal_architecture_audit/summary.json
          if git diff --cached --quiet; then
            echo "No causal audit result changes to commit."
          else
            git commit -m "Record causal architecture audit for ${GITHUB_SHA}"
            git push origin HEAD:feature/pretorius-causal-audit-v0.3
          fi
