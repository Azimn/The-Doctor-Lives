name: Conclave isolated research checks
on:
  push:
    branches: ["feature/pretorius-conclave-20261029"]
    paths:
      - "doctor_lives/conclave.py"
      - "doctor_lives/organs.py"
      - "tests/test_conclave.py"
      - ".github/workflows/conclave-checks.yml"
  pull_request:
    paths:
      - "doctor_lives/conclave.py"
      - "doctor_lives/organs.py"
      - "tests/test_conclave.py"
      - ".github/workflows/conclave-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conclave-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install canonical brain and its declared dependencies
        run: python -m pip install -e .
      - name: Compile new module and tests
        run: python -m py_compile doctor_lives/conclave.py tests/test_conclave.py
      - name: Run Conclave authority and persistence tests
        run: python -m unittest tests/test_conclave.py -v
      - name: Existing six-organ regressions
        run: python -m unittest discover -s tests -p "test_six_organ_runtime.py" -v
