name: deep-history-v2-validation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/pretorius-deep-history-v2

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Deep-History v2
        uses: actions/checkout@v4

      - name: Checkout exact Deep-History v1 production baseline
        uses: actions/checkout@v4
        with:
          ref: 7be60ed46add7c74359b322cc033aa7dfabb08e8
          path: _migration/v1
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clean-install current package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Validate fresh v2 boot and exact v1 to v2 migration
        run: |
          python tools/validate_deep_history_v2.py \
            --v1-root _migration/v1 \
            --output artifacts/deep-history-v2-validation/validation.json

      - name: Run full regression suite
        run: python -m unittest discover -s tests -v

      - name: Show validation record
        run: cat artifacts/deep-history-v2-validation/validation.json

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: deep-history-v2-validation-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/deep-history-v2-validation/
          if-no-files-found: error
