name: Actual Doctor Unified Home Living
on:
  push:
    branches:
      - experiment/doctor-living-action-bridge-20261018
  pull_request:
    paths:
      - doctor_lives/living_action_bridge.py
      - tests/test_living_action_bridge.py
      - .github/workflows/doctor-living-action-bridge.yml
  workflow_dispatch:
jobs:
  real-brain-and-single-world:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Azimn/Pretorius-Laboratory
          ref: 404e4eade71d9999dc5e470f8260a8cd7a4d7018
          path: unified-laboratory
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original Doctor cognition dependencies
        run: python -m pip install -e .
      - name: Run actual Doctor memory + book and parlor overnight source test
        env:
          PYTHONPATH: unified-laboratory
        run: python -m unittest discover -s tests -p test_living_action_bridge.py -v
      - name: Preserve original Doctor bridge regressions
        env:
          PYTHONPATH: unified-laboratory
        run: python -m unittest discover -s tests -p test_lab_home_bridge.py -v
