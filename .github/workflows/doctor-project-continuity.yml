name: Doctor Self-Directed Project Continuity
on:
  push:
    branches:
      - experiment/doctor-project-continuity-20261018
  pull_request:
    paths:
      - doctor_lives/lab_home_bridge.py
      - tests/test_doctor_projects.py
      - .github/workflows/doctor-project-continuity.yml
  workflow_dispatch:
jobs:
  lived-projects:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Azimn/Pretorius-Laboratory
          ref: 3cf96d82df3d4df3659a8314959a763be0e808f3
          path: pinned-laboratory
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Doctor brain port without changing his identity
        run: python -m pip install -e .
      - name: Real Doctor intention pause return and evidence tests
        env:
          PYTHONPATH: pinned-laboratory
        run: python -m unittest discover -s tests -p test_doctor_projects.py -v
      - name: Original Doctor-Laboratory verified experience tests
        env:
          PYTHONPATH: pinned-laboratory
        run: python -m unittest discover -s tests -p test_doctor_unified_home.py -v
      - name: Original Doctor regression suite
        env:
          PYTHONPATH: pinned-laboratory
        run: python -m unittest discover -s tests -v
