name: eidolon-engine-research-pilot
on:
  push:
    paths:
      - 'doctor_lives/eidolon.py'
      - 'tests/test_eidolon_engine.py'
      - 'scripts/run_eidolon_pilot.py'
      - '.github/workflows/eidolon-engine-research-pilot.yml'
  pull_request:
    paths:
      - 'doctor_lives/eidolon.py'
      - 'tests/test_eidolon_engine.py'
      - 'scripts/run_eidolon_pilot.py'
      - '.github/workflows/eidolon-engine-research-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest -v tests.test_eidolon_engine
      - run: python scripts/run_eidolon_pilot.py --output results/eidolon/construction_assay.json
      - uses: actions/upload-artifact@v4
        with:
          name: eidolon-construction-assay
          path: results/eidolon/construction_assay.json
          if-no-files-found: error
