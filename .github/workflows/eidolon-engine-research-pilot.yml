name: eidolon-engine-research-pilot
on:
  push:
    paths:
      - 'doctor_lives/eidolon.py'
      - 'doctor_lives/eidolon_temporal.py'
      - 'doctor_lives/eidolon_choice.py'
      - 'doctor_lives/eidolon_noetic.py'
      - 'doctor_lives/eidolon_balanced_decoder.py'
      - 'doctor_lives/eidolon_outcome_lab.py'
      - 'doctor_lives/eidolon_lab_action_bridge.py'
      - 'research/eidolon_e5_dev_cases.json'
      - 'tests/test_eidolon_engine.py'
      - 'tests/test_eidolon_e2.py'
      - 'tests/test_eidolon_temporal.py'
      - 'tests/test_eidolon_choice.py'
      - 'tests/test_eidolon_stress.py'
      - 'tests/test_eidolon_native_comparator.py'
      - 'tests/test_eidolon_e4.py'
      - 'tests/test_eidolon_e4b.py'
      - 'tests/test_eidolon_e4b_order.py'
      - 'tests/test_eidolon_e4c.py'
      - 'tests/test_eidolon_e5.py'
      - 'tests/test_eidolon_e5_p0a.py'
      - 'scripts/run_eidolon_pilot.py'
      - 'scripts/run_eidolon_e2.py'
      - 'scripts/run_eidolon_d2.py'
      - 'scripts/run_eidolon_d3.py'
      - 'scripts/run_eidolon_d3_stress.py'
      - 'scripts/run_eidolon_d3_stress_v02.py'
      - 'scripts/run_eidolon_e4.py'
      - 'scripts/run_eidolon_e4b.py'
      - 'scripts/run_eidolon_e4b_order.py'
      - 'scripts/run_eidolon_e4c.py'
      - 'scripts/run_eidolon_e5.py'
      - 'scripts/run_eidolon_e5_p0a.py'
      - '.github/workflows/eidolon-engine-research-pilot.yml'
  pull_request:
    paths:
      - 'doctor_lives/eidolon.py'
      - 'doctor_lives/eidolon_temporal.py'
      - 'doctor_lives/eidolon_choice.py'
      - 'doctor_lives/eidolon_noetic.py'
      - 'doctor_lives/eidolon_balanced_decoder.py'
      - 'doctor_lives/eidolon_outcome_lab.py'
      - 'doctor_lives/eidolon_lab_action_bridge.py'
      - 'research/eidolon_e5_dev_cases.json'
      - 'tests/test_eidolon_engine.py'
      - 'tests/test_eidolon_e2.py'
      - 'tests/test_eidolon_temporal.py'
      - 'tests/test_eidolon_choice.py'
      - 'tests/test_eidolon_stress.py'
      - 'tests/test_eidolon_native_comparator.py'
      - 'tests/test_eidolon_e4.py'
      - 'tests/test_eidolon_e4b.py'
      - 'tests/test_eidolon_e4b_order.py'
      - 'tests/test_eidolon_e4c.py'
      - 'tests/test_eidolon_e5.py'
      - 'tests/test_eidolon_e5_p0a.py'
      - 'scripts/run_eidolon_pilot.py'
      - 'scripts/run_eidolon_e2.py'
      - 'scripts/run_eidolon_d2.py'
      - 'scripts/run_eidolon_d3.py'
      - 'scripts/run_eidolon_d3_stress.py'
      - 'scripts/run_eidolon_d3_stress_v02.py'
      - 'scripts/run_eidolon_e4.py'
      - 'scripts/run_eidolon_e4b.py'
      - 'scripts/run_eidolon_e4b_order.py'
      - 'scripts/run_eidolon_e4c.py'
      - 'scripts/run_eidolon_e5.py'
      - 'scripts/run_eidolon_e5_p0a.py'
      - '.github/workflows/eidolon-engine-research-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest -v tests.test_eidolon_engine tests.test_eidolon_e2 tests.test_eidolon_temporal tests.test_eidolon_choice tests.test_eidolon_stress tests.test_eidolon_native_comparator tests.test_eidolon_e4 tests.test_eidolon_e4b tests.test_eidolon_e4b_order tests.test_eidolon_e4c tests.test_eidolon_e5 tests.test_eidolon_e5_p0a
      - run: python scripts/run_eidolon_pilot.py --output results/eidolon/construction_assay.json
      - run: python scripts/run_eidolon_e2.py --output results/eidolon/e2_no_cue_assay.json
      - run: python scripts/run_eidolon_d2.py --output results/eidolon/d2_source_clock_assay.json
      - run: python scripts/run_eidolon_d3.py --output results/eidolon/d3_matched_clone_assay.json
      - run: python scripts/run_eidolon_d3_stress.py --output results/eidolon/d3_stress_multiseed.json
      - run: python scripts/run_eidolon_d3_stress_v02.py --output results/eidolon/d3_stress_native_comparator.json
      - run: python scripts/run_eidolon_e4.py --output results/eidolon/e4_recurrent_decoder_assay.json
      - run: python scripts/run_eidolon_e4b.py --output results/eidolon/e4b_noetic_assay.json
      - run: python scripts/run_eidolon_e4b_order.py --output results/eidolon/e4b_order_crossover.json
      - run: python scripts/run_eidolon_e4c.py --output results/eidolon/e4c_balanced_decoder_assay.json
      - run: python scripts/run_eidolon_e5.py --output results/eidolon/e5_development_outcome_assay.json
      - run: python scripts/run_eidolon_e5_p0a.py --output results/eidolon/e5_p0a_real_policy_assay.json
      - uses: actions/upload-artifact@v4
        with:
          name: eidolon-construction-assay
          path: |
            results/eidolon/construction_assay.json
            results/eidolon/e2_no_cue_assay.json
            results/eidolon/d2_source_clock_assay.json
            results/eidolon/d3_matched_clone_assay.json
            results/eidolon/d3_stress_multiseed.json
            results/eidolon/d3_stress_native_comparator.json
            results/eidolon/e4_recurrent_decoder_assay.json
            results/eidolon/e4b_noetic_assay.json
            results/eidolon/e4b_order_crossover.json
            results/eidolon/e4c_balanced_decoder_assay.json
            results/eidolon/e5_development_outcome_assay.json
            results/eidolon/e5_p0a_real_policy_assay.json
          if-no-files-found: error
