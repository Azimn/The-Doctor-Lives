name: endogenous-recall-synthetic-research
on:
  push:
    branches:
      - research/endogenous-recall-v01
  workflow_dispatch:

jobs:
  synthetic-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Verify isolated synthetic policy action
        run: python -m unittest discover -s tests -p 'test_endogenous_recall*.py' -v\n      - name: Run matched-arm source-grounded outcomes\n        run: python tools/run_endogenous_recall_benchmark.py --seed 1842 > /tmp/endogenous_recall_benchmark.json\n      - name: Print compact outcome summary\n        run: python -c 'import json; print(json.load(open("/tmp/endogenous_recall_benchmark.json"))["summary"])'
