name: Pretorius verified experience to physical action

on:
  pull_request:
    paths:
      - doctor_lives/experience_to_action.py
      - tests/test_six_organ_experience_to_action.py
      - docs/experiments/EXPERIENCE_TO_ACTION_PREREG_2026-10-28.md
      - .github/workflows/experience-to-action.yml
  workflow_dispatch:

jobs:
  pinned-real-laboratory:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Azimn/Pretorius-Laboratory
          ref: 6e49795752835d64fa6fd63d16359669a1ca2ba7
          path: donor-laboratory
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install unchanged Doctor dependencies
        run: python -m pip install -e .
      - name: Prove actual pinned Lab is present; do not count skipped tests
        env:
          PYTHONPATH: donor-laboratory
        run: |
          python -c "from pretorius_lab.subject_port import SubjectPort; from pretorius_lab.book_library import BookLibrary; print('Actual source-pinned Laboratory loaded')"
      - name: Run real work-outcome learning arms
        env:
          PYTHONPATH: donor-laboratory
        run: |
          python -m unittest discover -s tests -p test_six_organ_experience_to_action.py -v
      - name: Preserve earlier autobiographical book preference controls
        env:
          PYTHONPATH: donor-laboratory
        run: |
          python -m unittest discover -s tests -p test_six_organ_autobiographical_book_preference.py -v
      - name: Preserve original authenticated Laboratory bridge
        env:
          PYTHONPATH: donor-laboratory
        run: |
          python -m unittest discover -s tests -p test_lab_home_bridge.py -v
