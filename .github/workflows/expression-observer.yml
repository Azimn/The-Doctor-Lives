name: Existing Doctor Lives Expression and runner observer
on:
  pull_request:
    paths:
      - 'doctor_lives/**'
      - 'tests/test_m6_conversation.py'
      - 'tests/test_soak_observer.py'
      - 'scripts/observe_soak_runner.py'
      - '.github/workflows/expression-observer.yml'
permissions:
  contents: read
jobs:
  observer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_soak_observer.py -v
