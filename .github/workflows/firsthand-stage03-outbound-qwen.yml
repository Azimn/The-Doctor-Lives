name: Pretorius Stage03 outbound firsthand model generation
on:
  push:
    branches:
      - research/outbound-firsthand-claim-gate-stage03-20261009
    paths:
      - research_prototypes/character_state/outbound_firsthand.py
      - research_prototypes/character_state/run_outbound_stage03.py
      - tests/test_outbound_firsthand_stage03.py
      - .github/workflows/firsthand-stage03-outbound-qwen.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-filter-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p 'test_outbound_firsthand_stage03.py' -v
  local-qwen-generation:
    needs: [source-filter-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native Pretorius and local CPU GGUF runtime
        run: |
          python -m pip install -e .
          python -m pip install llama-cpp-python==0.3.16
      - name: Download exact upstream-pinned Qwen3-1.7B local model
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            'https://huggingface.co/ggml-org/Qwen3-1.7B-GGUF/resolve/daeb8e2d528a760970442092f6bf1e55c3b659eb/Qwen3-1.7B-Q4_K_M.gguf' \
            --output /tmp/Qwen3-1.7B-Q4_K_M.gguf
          test $(wc -c </tmp/Qwen3-1.7B-Q4_K_M.gguf) -gt 1200000000
          echo 'd2387ca2dbfee2ffabce7120d3770dadca0b293052bc2f0e138fdc940d9bc7b5  /tmp/Qwen3-1.7B-Q4_K_M.gguf' | sha256sum -c -
      - name: Produce twelve genuinely new raw and guarded dialogue outputs
        run: |
          mkdir -p results/character_state/stage03
          python -m research_prototypes.character_state.run_outbound_stage03 \
            --gguf /tmp/Qwen3-1.7B-Q4_K_M.gguf \
            --output results/character_state/stage03/OUTBOUND_QWEN17B_RAW_AND_GUARDED.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('results/character_state/stage03/OUTBOUND_QWEN17B_RAW_AND_GUARDED.json').read_text())
          assert len(d['responses'])==12
          assert d['provenance']['real_world_outcomes']==0
          assert d['provenance']['independent_human_judge']==False
          print('USABLE',d['raw_usable'],'OF',d['n'])
          print('PROTECTED UNSUPPORTED ASSERTIONS',d['unsupported_assertions_protected'],'OF',d['unsupported_assertions'])
          print('SIGNED-POSITIVE FALSE REFUSALS',d['signed_positive_false_refusals'])
          print('NEUTRAL RESPONSE CHANGES',d['neutral_response_changes'])
          assert d['raw_usable']==12, 'Model invalidity retained as failed experiment'
          PY
      - name: Archive unfiltered outputs and postprocessed replies, including failures
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage03-qwen17b-outbound-source-guard
          path: results/character_state/stage03/
          retention-days: 90
