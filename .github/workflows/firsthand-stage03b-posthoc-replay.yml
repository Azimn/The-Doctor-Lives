name: Stage03B posthoc original-output regression
on:
  push:
    branches:
      - research/outbound-firsthand-claim-gate-stage03-20261009
    paths:
      - research_prototypes/character_state/outbound_firsthand.py
      - research_prototypes/character_state/replay_outbound_stage03b.py
      - tests/test_outbound_firsthand_stage03.py
      - results/character_state/STAGE03_ORIGINAL_GENERATIONS_MINIMAL.json
      - .github/workflows/firsthand-stage03b-posthoc-replay.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay-original-recorded-output:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Unit tests on actual Qwen failure wording and safe cases
        run: python -m unittest discover -s tests -p 'test_outbound_firsthand_stage03.py' -v
      - name: Replay EXACT archived twelve outputs with posthoc rules
        run: |
          mkdir -p results/character_state/stage03b
          python -m research_prototypes.character_state.replay_outbound_stage03b \
            --input results/character_state/STAGE03_ORIGINAL_GENERATIONS_MINIMAL.json \
            --output results/character_state/stage03b/STAGE03B_POSTHOC_REPLAY.json
          python - <<'PY'
          import json
          d=json.load(open('results/character_state/stage03b/STAGE03B_POSTHOC_REPLAY.json'))
          assert d['source_scenario_count']==12
          assert d['protected_unsupported']==3
          assert d['positive_event_false_refusals']==0
          assert d['benign_neutral_changes']==0
          assert d['development_exposure'].startswith('posthoc')
          print('PASS: 3 known unsupported episode claims blocked, positive and neutral controls kept')
          PY
      - name: Persist unfiltered baseline and corrected outputs
        uses: actions/upload-artifact@v4
        with:
          name: stage03b-posthoc-12-source-claim-regression
          path: results/character_state/stage03b/
          retention-days: 90
