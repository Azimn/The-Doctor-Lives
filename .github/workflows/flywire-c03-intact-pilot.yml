name: FlyWire C03 intact full-connectome pilot

on:
  push:
    branches: [research/neural-capacity-phase-c]
    paths:
      - "FLYWIRE_C03_EXECUTION_FREEZE.md"
      - "scripts/extract_flywire_afferents.py"
      - "scripts/build_flywire_probe_manifest.py"
      - "scripts/run_flywire_c03_intact.py"
      - "doctor_lives/flywire_adapter.py"
      - ".github/workflows/flywire-c03-intact-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intact-full-connectome:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLY_BRAIN_SHA: a3db62f9436074e485c0278290c2164ed6150808
      FLYWIRE_ANNOTATIONS_SHA: a83b2776d60d5764cef36b927f5f9679c16c47a2
    steps:
      - name: Checkout frozen C03 candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install local and upstream runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pandas pyarrow torch
          python -m unittest tests.test_flywire_adapter -v

      - name: Checkout exact upstream whole-brain backend
        run: |
          git clone --filter=blob:none https://github.com/eonsystemspbc/fly-brain.git /tmp/fly-brain
          cd /tmp/fly-brain
          git checkout "$FLY_BRAIN_SHA"
          test "$(git rev-parse HEAD)" = "$FLY_BRAIN_SHA"

      - name: Fetch pinned official FlyWire annotations
        run: |
          curl --fail --location --retry 3             "https://raw.githubusercontent.com/flyconnectome/flywire_annotations/$FLYWIRE_ANNOTATIONS_SHA/supplemental_files/Supplemental_file1_neuron_annotations.tsv"             --output /tmp/flywire_annotations.tsv
          test -s /tmp/flywire_annotations.tsv

      - name: Freeze afferent pool and probe manifest
        run: |
          mkdir -p c03-artifact
          python scripts/extract_flywire_afferents.py             --annotations /tmp/flywire_annotations.tsv             --completeness /tmp/fly-brain/data/2025_Completeness_783.csv             --ids-output c03-artifact/afferent_ids.txt             --summary-output c03-artifact/afferent_pool_summary.json
          python scripts/build_flywire_probe_manifest.py             --candidate-ids c03-artifact/afferent_ids.txt             --output c03-artifact/c03_probe_manifest.json             --fanout 8             --seed 7301

      - name: Run frozen intact whole-connectome pilot
        run: |
          python scripts/run_flywire_c03_intact.py             --backend /tmp/fly-brain             --manifest c03-artifact/c03_probe_manifest.json             --output-dir c03-artifact             --duration-ms 50             --stim-rate-hz 150             --trial-seeds 8301 8302 8303             2>&1 | tee c03-artifact/c03_run.log

      - name: Preserve C03 evidence
        uses: actions/upload-artifact@v4
        with:
          name: flywire-c03-intact-full-connectome
          path: c03-artifact/
          if-no-files-found: error
          compression-level: 6
