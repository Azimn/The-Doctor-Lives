name: FlyWire C04 topology controls

on:
  push:
    branches: [research/neural-capacity-phase-c]
    paths:
      - "FLYWIRE_C04_TOPOLOGY_CONTROL_FREEZE.md"
      - "scripts/build_flywire_c04_control.py"
      - "scripts/run_flywire_c04_condition.py"
      - "scripts/compare_flywire_c04.py"
      - ".github/workflows/flywire-c04-topology-controls.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  condition:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: intact
            condition: INTACT
            topology_seed: none
          - label: degree-9401
            condition: DEGREE_PRESERVING
            topology_seed: "9401"
          - label: degree-9402
            condition: DEGREE_PRESERVING
            topology_seed: "9402"
          - label: degree-9403
            condition: DEGREE_PRESERVING
            topology_seed: "9403"
          - label: random-9501
            condition: RANDOM_SCALE
            topology_seed: "9501"
          - label: random-9502
            condition: RANDOM_SCALE
            topology_seed: "9502"
          - label: random-9503
            condition: RANDOM_SCALE
            topology_seed: "9503"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLY_BRAIN_SHA: a3db62f9436074e485c0278290c2164ed6150808
      FLYWIRE_ANNOTATIONS_SHA: a83b2776d60d5764cef36b927f5f9679c16c47a2
      SHUFFLE_REPO_SHA: e417b33616513ef350b1b1c3cdf2b5b7a1799c8e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pandas pyarrow torch
          python -m unittest tests.test_flywire_adapter -v
      - name: Checkout pinned reuse sources
        run: |
          git clone --filter=blob:none https://github.com/eonsystemspbc/fly-brain.git /tmp/fly-brain
          git -C /tmp/fly-brain checkout "$FLY_BRAIN_SHA"
          test "$(git -C /tmp/fly-brain rev-parse HEAD)" = "$FLY_BRAIN_SHA"
          git clone --filter=blob:none https://github.com/Kisame76/drosophila-brain-mlx.git /tmp/fly-mlx
          git -C /tmp/fly-mlx checkout "$SHUFFLE_REPO_SHA"
          test "$(git -C /tmp/fly-mlx rev-parse HEAD)" = "$SHUFFLE_REPO_SHA"
      - name: Recreate frozen C03 afferent manifest
        run: |
          mkdir -p c04-artifact
          curl --fail --location --retry 3             "https://raw.githubusercontent.com/flyconnectome/flywire_annotations/$FLYWIRE_ANNOTATIONS_SHA/supplemental_files/Supplemental_file1_neuron_annotations.tsv"             --output /tmp/flywire_annotations.tsv
          python scripts/extract_flywire_afferents.py             --annotations /tmp/flywire_annotations.tsv             --completeness /tmp/fly-brain/data/2025_Completeness_783.csv             --ids-output c04-artifact/afferent_ids.txt             --summary-output c04-artifact/afferent_pool_summary.json
          python scripts/build_flywire_probe_manifest.py             --candidate-ids c04-artifact/afferent_ids.txt             --output c04-artifact/c03_probe_manifest.json             --fanout 8 --seed 7301
          grep -q 7204b9ac2860d94b5ac28edb5976695831b61e366a920da67629ee8c99a13228             c04-artifact/c03_probe_manifest.json
      - name: Build topology control
        if: matrix.condition != 'INTACT'
        env:
          CONTROL_CONDITION: ${{ matrix.condition }}
          CONTROL_SEED: ${{ matrix.topology_seed }}
        run: |
          KIND=degree
          if [ "$CONTROL_CONDITION" = "RANDOM_SCALE" ]; then KIND=random; fi
          python scripts/build_flywire_c04_control.py             --condition "$KIND"             --seed "$CONTROL_SEED"             --source /tmp/fly-brain/data/2025_Connectivity_783.parquet             --completeness /tmp/fly-brain/data/2025_Completeness_783.csv             --shuffle-repo /tmp/fly-mlx             --output c04-artifact/control_connectivity.parquet             --validation-output c04-artifact/topology_validation.json
      - name: Select connectivity
        env:
          CONTROL_CONDITION: ${{ matrix.condition }}
        run: |
          if [ "$CONTROL_CONDITION" = "INTACT" ]; then
            echo "CONNECTIVITY=/tmp/fly-brain/data/2025_Connectivity_783.parquet" >> "$GITHUB_ENV"
          else
            echo "CONNECTIVITY=$GITHUB_WORKSPACE/c04-artifact/control_connectivity.parquet" >> "$GITHUB_ENV"
          fi
      - name: Run frozen neural condition
        env:
          CONTROL_CONDITION: ${{ matrix.condition }}
          CONTROL_SEED: ${{ matrix.topology_seed }}
        run: |
          python scripts/run_flywire_c04_condition.py             --backend /tmp/fly-brain             --connectivity "$CONNECTIVITY"             --manifest c04-artifact/c03_probe_manifest.json             --condition "$CONTROL_CONDITION"             --topology-seed "$CONTROL_SEED"             --output-dir c04-artifact             2>&1 | tee c04-artifact/c04_run.log
      - uses: actions/upload-artifact@v4
        with:
          name: flywire-c04-${{ matrix.label }}
          path: |
            c04-artifact/afferent_pool_summary.json
            c04-artifact/c03_probe_manifest.json
            c04-artifact/topology_validation.json
            c04-artifact/c04_condition_summary.json
            c04-artifact/c04_condition_responses.npz
            c04-artifact/c04_run.log
          if-no-files-found: warn
          compression-level: 6

  compare:
    needs: condition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: flywire-c04-*
          path: c04-downloaded
      - name: Compare frozen topology conditions
        run: |
          python scripts/compare_flywire_c04.py             --root c04-downloaded             --output c04-comparison.json
      - uses: actions/upload-artifact@v4
        with:
          name: flywire-c04-comparison
          path: c04-comparison.json
          if-no-files-found: error
