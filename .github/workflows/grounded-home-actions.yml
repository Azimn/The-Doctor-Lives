name: Grounded Laboratory Home Actions
on:
  push:
    branches:
      - experiment/lab-grounded-action-arbitration-20261018
  pull_request:
    paths:
      - doctor_lives/home_grounded_actions.py
      - doctor_lives/home_grounded_screen.py
      - tests/test_home_grounded_actions.py
      - tools/run_home_grounded_screen.py
      - .github/workflows/grounded-home-actions.yml
  workflow_dispatch:
jobs:
  grounded-physical-choices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Azimn/Pretorius-Laboratory
          ref: 6e49795752835d64fa6fd63d16359669a1ca2ba7
          path: pinned-laboratory
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real Doctor runtime
        run: python -m pip install -e .
      - name: Source authenticity and real-world action tests
        env:
          PYTHONPATH: pinned-laboratory
        run: python -m unittest discover -s tests -p test_home_grounded_actions.py -v
      - name: Compare all matched real Doctor worlds and simple controls
        env:
          PYTHONPATH: pinned-laboratory
        run: python -m tools.run_home_grounded_screen --output results/article08_grounded_home_actions.json
      - name: Preserve actual outcomes including all failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: article08-grounded-home-action-comparison
          path: results/article08_grounded_home_actions.json
          if-no-files-found: warn
