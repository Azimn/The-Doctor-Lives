name: Pretorius household-choice causal pilot
on:
  push:
    branches:
      - experiment/home-decision-comparative-pilot-20261015
  pull_request:
    paths:
      - doctor_lives/home_choice_probe.py
      - tests/test_home_choice_probe.py
      - tools/run_lab_home_choice_pilot.py
      - .github/workflows/home-choice-pilot.yml
  workflow_dispatch:
jobs:
  controlled-home-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Azimn/Pretorius-Laboratory
          ref: 6e49795752835d64fa6fd63d16359669a1ca2ba7
          path: pinned-lab
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Doctor dependencies
        run: python -m pip install -e .
      - name: Run native-Doctor versus same-observation rule baseline
        env:
          PYTHONPATH: pinned-lab
        run: |
          python -m unittest discover -s tests -p test_home_choice_probe.py -v
          python -m tools.run_lab_home_choice_pilot --output results/home-choice-pilot.json
      - name: Archive causal pilot data
        uses: actions/upload-artifact@v4
        with:
          name: actual-doctor-home-choice-pilot
          path: results/home-choice-pilot.json
