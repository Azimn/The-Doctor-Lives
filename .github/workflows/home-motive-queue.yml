name: Sims-inspired home motive and activity queue
on:
  push:
    branches:
      - experiment/lab-motive-affordance-queue-20261015
  pull_request:
    paths:
      - doctor_lives/home_motive_queue.py
      - tests/test_home_motive_queue.py
      - doctor_lives/home_motive_pilot.py
      - tools/run_home_motive_pilot.py
      - .github/workflows/home-motive-queue.yml
  workflow_dispatch:
jobs:
  real-home-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Azimn/Pretorius-Laboratory
          ref: 6e49795752835d64fa6fd63d16359669a1ca2ba7
          path: pinned-lab
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Doctor dependencies
        run: python -m pip install -e .
      - name: Exercise motive affordances and interruptible home work on actual Doctor
        env:
          PYTHONPATH: pinned-lab
        run: |
          python -m unittest discover -s tests -p test_home_motive_queue.py -v
      - name: Run independent household motivation outcome comparison
        if: hashFiles('doctor_lives/home_motive_pilot.py') != ''
        env:
          PYTHONPATH: pinned-lab
        run: |
          python -m unittest discover -s tests -p test_home_motive_pilot.py -v
          python -m tools.run_home_motive_pilot --output results/home-motive-pilot.json
      - name: Archive home motive pilot outcomes
        if: hashFiles('results/home-motive-pilot.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: real-doctor-home-motive-pilot
          path: results/home-motive-pilot.json
