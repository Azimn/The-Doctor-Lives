name: ipseity-real-ollama-smoke
# The live smoke also verifies actual host output receipts and first-person
# memory of written replies, distinct from merely generating model text.

# Bounded one-shot CPU smoke on a deliberately small free local model.
# Runs on relevant changes to the live integration gate, not unrelated research
# branches. This tests the exact branch head, including controller recollection.
on:
  push:
    branches:
      - integration/synthetic-ipseity-subject-path
    paths:
      - .github/workflows/ipseity-real-ollama-smoke.yml
      - tools/ipseity_live_ollama_smoke.py
      - doctor_lives/chassis.py
      - doctor_lives/ipseity_integration.py
      - doctor_lives/ipseity_local.py
      - doctor_lives/subject_inquiry.py
      - doctor_lives/speech_emission.py
  pull_request:
    paths:
      - .github/workflows/ipseity-real-ollama-smoke.yml
      - tools/ipseity_live_ollama_smoke.py
      - doctor_lives/chassis.py
      - doctor_lives/ipseity_integration.py
      - doctor_lives/subject_inquiry.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-local-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_MODELS: /tmp/pretorius-ollama-models
      OLLAMA_NO_CLOUD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Doctor and Synthetic Ipseity implementation
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/Azimn/synthetic-ipseity.git "$RUNNER_TEMP/synthetic-ipseity"
          git -C "$RUNNER_TEMP/synthetic-ipseity" checkout --detach e2d1dc3978c952e59d270a29e84704c8a1fe264a
          python -m pip install -e "$RUNNER_TEMP/synthetic-ipseity"
          python -m pip install -e .
          python -c "from synthetic_ipseity import Kind; assert Kind.PROJECTED_SUBJECT_EVENT.value == 'projected_subject_event'"
      - name: Install pinned official Ollama release
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq zstd
          fi
          curl -fsSL --retry 3 --max-time 480 \
            https://github.com/ollama/ollama/releases/download/v0.40.3/ollama-linux-amd64.tar.zst \
            -o "$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
          echo "ce6f8b671a699bf1ebafb28d60dbbabf4f37b30b499145fa308a8ba72de021d6  $RUNNER_TEMP/ollama-linux-amd64.tar.zst" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/ollama-dist"
          tar --zstd -xf "$RUNNER_TEMP/ollama-linux-amd64.tar.zst" -C "$RUNNER_TEMP/ollama-dist"
          test -x "$RUNNER_TEMP/ollama-dist/bin/ollama"
          echo "$RUNNER_TEMP/ollama-dist/bin" >> "$GITHUB_PATH"
      - name: Start actual loopback model server and pull small checkpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OLLAMA_MODELS"
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --noproxy '*' -fsS http://127.0.0.1:11434/api/version > "$RUNNER_TEMP/ollama-version.json"; then
              break
            fi
            sleep 2
          done
          curl --noproxy '*' -fsS http://127.0.0.1:11434/api/version
          timeout 400 ollama pull smollm2:135m
          ollama list
      - name: Run real Pretorius dialogue plus verified output-receipt smoke
        shell: bash
        run: |
          set -euo pipefail
          python tools/ipseity_live_ollama_smoke.py
      - name: Record reproducibility and source state
        if: always()
        shell: bash
        run: |
          printf 'doctor_sha=%s\n' "$GITHUB_SHA"
          printf 'ipseity_donor_sha=%s\n' 'e2d1dc3978c952e59d270a29e84704c8a1fe264a'
          printf 'ollama_release=%s\n' 'v0.40.3'
          if command -v ollama >/dev/null 2>&1; then
            ollama --version || true
          fi
