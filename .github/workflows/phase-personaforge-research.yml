name: PHASE PersonaForge research isolation
on:
  push:
    branches: [research/phase-personaforge-ablation-20261009]
    paths:
      - research_prototypes/character_state/**
      - tests/test_phase_personaforge_research.py
      - .github/workflows/phase-personaforge-research.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-gates-and-native-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Run original model-independent research tests on real Pretorius
        run: python -m unittest discover -s tests -p 'test_phase_personaforge_research.py' -v
      - name: Ensure no production module imports research branch
        run: |
          python - <<'PY'
          from pathlib import Path
          targets = Path('doctor_lives').rglob('*.py')
          offenders = [str(f) for f in targets if 'research_prototypes' in f.read_text(encoding='utf-8')]
          assert not offenders, offenders
          print('PASS: production module tree remains independent')
          PY
