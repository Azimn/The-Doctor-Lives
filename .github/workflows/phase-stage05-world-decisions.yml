name: Stage05 Qwen model-selected actual world actions
on:
  push:
    branches:
      - research/phase-world-decisions-stage05-20261010
    paths:
      - research_prototypes/character_state/run_phase_world_decisions_stage05.py
      - research_prototypes/character_state/world_host_ledger.py
      - tests/test_phase_world_decisions_stage05.py
      - .github/workflows/phase-stage05-world-decisions.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mechanical-source-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual Pretorius brain
        run: python -m pip install -e .
      - name: Verify 12 original tasks, world oracle, source-matched flat vs PHASE
        run: python -m unittest discover -s tests -p 'test_phase_world_decisions_stage05.py' -v
  actual-qwen-world-actions:
    needs: [mechanical-source-parity]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native source and local no-API inference runtime
        run: |
          python -m pip install -e .
          python -m pip install llama-cpp-python==0.3.16
      - name: Exact upstream open-model download and checksum gate
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            'https://huggingface.co/ggml-org/Qwen3-1.7B-GGUF/resolve/daeb8e2d528a760970442092f6bf1e55c3b659eb/Qwen3-1.7B-Q4_K_M.gguf' \
            --output /tmp/Qwen3-1.7B-Q4_K_M.gguf
          test $(wc -c </tmp/Qwen3-1.7B-Q4_K_M.gguf) -gt 1200000000
          echo 'd2387ca2dbfee2ffabce7120d3770dadca0b293052bc2f0e138fdc940d9bc7b5  /tmp/Qwen3-1.7B-Q4_K_M.gguf' | sha256sum -c -
      - name: Run real model action decisions against persisted authorized world host
        run: |
          mkdir -p results/character_state/stage05
          python -m research_prototypes.character_state.run_phase_world_decisions_stage05 \
            --gguf /tmp/Qwen3-1.7B-Q4_K_M.gguf \
            --output results/character_state/stage05/ACTUAL_MODEL_WORLD_DECISIONS.json
          python - <<'PY'
          import json
          with open('results/character_state/stage05/ACTUAL_MODEL_WORLD_DECISIONS.json') as file: p=json.load(file)
          assert p['n_arm_runs']==24
          assert p['n_scenarios']==12
          assert p['oracle_ceiling_successes']==12
          assert p['source']['no_paid_api'] is True
          assert p['source']['independent_scenario_author'] is False
          for arm in ('flat_current','phase_current'):
              assert p['by_arm'][arm]['n']==12
          for v in p['results']:
              assert v['all_attested_world_results_sourced']
          print('FLAT_SUCCESS',p['by_arm']['flat_current']['world_goal_successes'])
          print('PHASE_SUCCESS',p['by_arm']['phase_current']['world_goal_successes'])
          print('ORACLE_CEILING',p['oracle_ceiling_successes'])
          print('PASS: independent world host decides action outcomes, not LLM self-report')
          PY
      - name: Archive COMPLETE response/action/host success and denial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage05-qwen17b-model-selected-world-actions
          path: results/character_state/stage05/
          retention-days: 90
