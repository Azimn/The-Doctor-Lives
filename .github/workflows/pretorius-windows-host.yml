name: Pretorius original Laboratory Windows host and sealed offline install

on:
  pull_request:
    paths:
      - doctor_lives/lab_runtime.py
      - doctor_lives/lab_soak.py
      - tests/test_lab_soak.py
      - doctor_lives/lab_backup.py
      - doctor_lives/cli.py
      - doctor_lives/local_subject_gloss.py
      - doctor_lives/data/*.json
      - tests/test_lab_runtime.py
      - tests/test_evidence_integrity.py
      - tests/wheel_lab_start_smoke.py
      - docs/releases/PRETORIUS_V1_LOCAL_SUBJECT_CLI_2026-10-30.md
      - tools/offline_wheelhouse.py
      - .gitattributes
      - pyproject.toml
      - .github/workflows/pretorius-windows-host.yml
  workflow_dispatch:

jobs:
  pinned-original-lab-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Azimn/Pretorius-Laboratory
          ref: 6e49795752835d64fa6fd63d16359669a1ca2ba7
          path: donor-laboratory
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing Doctor and original Laboratory for source-level Windows tests
        shell: pwsh
        run: |
          python -m pip install -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -e ./donor-laboratory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from pretorius_lab.subject_port import SubjectPort; print('Pinned original Laboratory imported on Windows')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Original-world Windows process leases, cold restart, sleep and elapsed observation
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_lab_runtime.py -v -k cross_platform_two_authority -k elapsed_host_resumes_same_brain -k human_subject_transcript -k elapsed_work_interval_rejected -k operator_sleep_is_physical_idempotent_and_wake_is_real -k local_model_only_sees_original -k unavailable_model_and_empty_frames -k invalid_model_denied
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows actual Laboratory soak, cold continuation and torn-log refusal
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_lab_soak.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows canonical evidence checkout and deliberate active-evidence tamper negatives
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_evidence_integrity.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and seal exact-source Windows wheels, then install with network disabled
        shell: pwsh
        run: |
          $wheelhouse = Join-Path $env:RUNNER_TEMP "pretorius-wheels"
          New-Item -ItemType Directory -Force -Path $wheelhouse | Out-Null
          python -m pip wheel --wheel-dir $wheelhouse . ./donor-laboratory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $doctorSha = (git rev-parse HEAD).Trim()
          $labSha = (git -C donor-laboratory rev-parse HEAD).Trim()
          if ($labSha -ne "6e49795752835d64fa6fd63d16359669a1ca2ba7") { throw "Original Laboratory checkout differs from pinned source" }
          python tools/offline_wheelhouse.py seal --wheelhouse $wheelhouse --doctor-sha $doctorSha --lab-sha $labSha
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/offline_wheelhouse.py verify --wheelhouse $wheelhouse --doctor-sha $doctorSha --lab-sha $labSha
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $venv = Join-Path $env:RUNNER_TEMP "pretorius-wheel-venv"
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $venvPython = Join-Path $venv "Scripts/python.exe"
          $env:PIP_NO_INDEX = "1"
          & $venvPython -m pip install --no-index --find-links $wheelhouse "the-doctor-lives[laboratory]==0.5.0rc2"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $venvPython -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run installed Windows console outside checkout, crash/restore and 4096-neuron original policy
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "pretorius-wheel-venv"
          $venvPython = Join-Path $venv "Scripts/python.exe"
          $env:PYTHONPATH = ""
          $env:PIP_NO_INDEX = "1"
          $env:PATH = (Join-Path $venv "Scripts") + ";" + $env:PATH
          Push-Location $env:RUNNER_TEMP
          try {
            & $venvPython (Join-Path $env:GITHUB_WORKSPACE "tests/wheel_lab_start_smoke.py")
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally { Pop-Location }
