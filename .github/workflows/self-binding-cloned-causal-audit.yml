name: self-binding-cloned-causal-audit
on:
  push:
    branches:
      - research/dual-gate-ritual-interface-20261009
    paths:
      - research_prototypes/ritual_interface/**
      - tests/test_self_binding_cloned_state.py
      - .github/workflows/self-binding-cloned-causal-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  causal-clones:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Run matched-state clone experiment
        run: |
          mkdir -p results/self_binding
          python -m research_prototypes.ritual_interface.run_cloned_state_causal | tee results/self_binding/exploratory_trace.log
          grep '^SELF_BINDING_CAUSAL_JSON=' results/self_binding/exploratory_trace.log | sed 's/^SELF_BINDING_CAUSAL_JSON=//' > results/self_binding/exploratory_result.json
          python -m json.tool results/self_binding/exploratory_result.json > /dev/null
      - name: Upload immutable per-run evidence
        uses: actions/upload-artifact@v4
        with:
          name: self-binding-clone-audit
          path: results/self_binding/
          retention-days: 90
