name: Canonical six-organ weather state and restart validation
on:
  pull_request:
    paths:
      - doctor_lives/canonical_affectus_weather.py
      - tests/test_six_organ_canonical_weather.py
      - doctor_lives/lab_six_organ_session.py
      - doctor_lives/lab_endogenous_book_task.py
      - doctor_lives/lab_native_goal_choice.py
      - tests/test_six_organ_native_goal_choice.py
      - tests/test_six_organ_endogenous_book_task.py
      - tests/test_six_organ_sustained_lab.py
      - .github/workflows/six-organ-canonical-session.yml
      - docs/experiments/SIX_ORGAN_SUSTAINED_LAB_PREREG_2026-10-26.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check out actual reviewed Affectus at exact immutable source
        uses: actions/checkout@v4
        with:
          repository: Azimn/Sensus-Communis-Artificialis
          ref: 904bf11861700739ccc03d4b0d4340ff3422a7d3
          path: pinned-affectus-donor
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Original canonical Pretorius
        run: python -m pip install -e .
      - name: Fail if source SHA is not reviewed
        run: test "$(git -C pinned-affectus-donor rev-parse HEAD)" = "904bf11861700739ccc03d4b0d4340ff3422a7d3"
      - name: Verify weather persists only via canonical BrainStore
        env:
          PRETORIUS_PINNED_AFFECTUS_ROOT: pinned-affectus-donor
        run: |
          python -m unittest discover -s tests -p test_six_organ_canonical_weather.py -v
      - name: Run complete existing Doctor regression suite without donor import overlay
        run: python -m unittest discover -s tests -v
  actual-six-organ-laboratory:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Azimn/Pretorius-Laboratory
          ref: 6e49795752835d64fa6fd63d16359669a1ca2ba7
          path: donor-laboratory
      - uses: actions/checkout@v4
        with:
          repository: Azimn/Sensus-Communis-Artificialis
          ref: 802e459ee68950414347d5fa324484c034f57b81
          path: donor-sensus
      - uses: actions/checkout@v4
        with:
          repository: Azimn/Sensus-Communis-Artificialis
          ref: 904bf11861700739ccc03d4b0d4340ff3422a7d3
          path: donor-affectus
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reviewed Ipseity and canonical Doctor
        run: |
          git clone --quiet https://github.com/Azimn/synthetic-ipseity.git "$RUNNER_TEMP/synthetic-ipseity"
          git -C "$RUNNER_TEMP/synthetic-ipseity" checkout --detach e2d1dc3978c952e59d270a29e84704c8a1fe264a
          python -m pip install -e "$RUNNER_TEMP/synthetic-ipseity"
          python -m pip install -e .
      - name: Verify all distinct immutable donor heads
        run: |
          test "$(git -C donor-laboratory rev-parse HEAD)" = "6e49795752835d64fa6fd63d16359669a1ca2ba7"
          test "$(git -C donor-sensus rev-parse HEAD)" = "802e459ee68950414347d5fa324484c034f57b81"
          test "$(git -C donor-affectus rev-parse HEAD)" = "904bf11861700739ccc03d4b0d4340ff3422a7d3"
          test "$(git -C "$RUNNER_TEMP/synthetic-ipseity" rev-parse HEAD)" = "e2d1dc3978c952e59d270a29e84704c8a1fe264a"
      - name: Verify twelve canonical organ cycles against real Laboratory and reviewed donors
        env:
          PYTHONPATH: donor-laboratory:donor-sensus
          PRETORIUS_PINNED_AFFECTUS_ROOT: donor-affectus
        run: |
          python -m unittest discover -s tests -p test_six_organ_sustained_lab.py -v
      - name: Run real-world neural-originated book goal / restart / refusal battery
        env:
          PYTHONPATH: donor-laboratory:donor-sensus
          PRETORIUS_PINNED_AFFECTUS_ROOT: donor-affectus
        run: |
          python -m unittest discover -s tests -p test_six_organ_endogenous_book_task.py -v
      - name: Test native two-goal read/rest choices with real world and restart
        env:
          PYTHONPATH: donor-laboratory:donor-sensus
          PRETORIUS_PINNED_AFFECTUS_ROOT: donor-affectus
        run: |
          python -m unittest discover -s tests -p test_six_organ_native_goal_choice.py -v
