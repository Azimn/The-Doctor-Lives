name: Six-organ Mnemosyne endogenous recall and causal controls
on:
  pull_request:
    paths:
      - doctor_lives/mnemosyne_pilot.py
      - doctor_lives/organs.py
      - tests/test_six_organ_mnemosyne_pilot.py
      - tests/test_six_organ_memory_cognition_feedback.py
      - .github/workflows/six-organ-mnemosyne-causal.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  endogenous-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install unchanged canonical Doctor
        run: python -m pip install -e .
      - name: Verify existing-donor endogenous recall selection and negative controls
        run: python -m unittest discover -s tests -p test_six_organ_mnemosyne_pilot.py -v
      - name: Verify first-person memory changes canonical policy, with lesion controls
        run: python -m unittest discover -s tests -p test_six_organ_memory_cognition_feedback.py -v
      - name: Retain original six-organ baseline
        run: python -m unittest discover -s tests -p test_six_organ_runtime.py -v
