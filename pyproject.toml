[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "the-doctor-lives"
version = "0.5.0rc2"
description = "Renderer-neutral persistent cognitive brain for Doctor Septimus Pretorius"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
self-reference-governor-preview = [
  "synthetic-ipseity @ git+https://github.com/Azimn/synthetic-ipseity.git@a70a7e9fc61ddf1706d27bfa0b0edf3caf71b7fa",
]

[project.scripts]
doctor-lives = "doctor_lives.cli:main"
doctor-lives-local = "doctor_lives.ipseity_local:main"
doctor-lives-three-organ-preview = "doctor_lives.three_organ_preview:main"

[tool.setuptools]
packages = ["doctor_lives"]

[tool.setuptools.package-data]
doctor_lives = ["data/*.json"]
